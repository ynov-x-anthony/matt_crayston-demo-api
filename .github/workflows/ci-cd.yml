name: CI-CD Microservices

on:
  push:
    branches:
      - main
      - master
      - quete-09-microservices
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-scan:
    name: Build and scan (${{ matrix.service }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: [api, notifier]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        shell: bash
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=${OWNER}/demo-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          load: true
          tags: demo-${{ matrix.service }}:ci

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: demo-${{ matrix.service }}:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish versioned image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ghcr.io/${{ steps.image.outputs.name }}:latest

  deploy:
    name: Deploy release
    runs-on: ubuntu-latest
    needs: build-and-scan

    # Le déploiement est limité aux tags de version.
    # ENABLE_DEPLOY doit être défini à true dans les variables GitHub.
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      vars.ENABLE_DEPLOY == 'true'

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0

        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GHCR_OWNER: ${{ github.repository_owner }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: RELEASE_TAG,GHCR_OWNER,DEPLOY_PATH

          script: |
            set -eu

            cd "$DEPLOY_PATH"

            OWNER="$(echo "$GHCR_OWNER" | tr '[:upper:]' '[:lower:]')"

            export API_IMAGE="ghcr.io/${OWNER}/demo-api:${RELEASE_TAG}"
            export NOTIFIER_IMAGE="ghcr.io/${OWNER}/demo-notifier:${RELEASE_TAG}"

            docker compose pull api notifier
            docker compose up -d --no-build
            docker compose ps